<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact Us | invoPay</title>

<link rel="stylesheet" href="assets/css/contact-us.css">

</head>

<body>

<div id="header-placeholder"></div>

<div class="contact-page">


<!-- hero -->

<div class="contact-hero">

<h1>Contact Us</h1>

<p>
لو عندك أي استفسار بخصوص الفواتير الإلكترونية أو استخدام منصة invoPay
تواصل معنا وسنقوم بالرد عليك في أسرع وقت.
</p>

</div>



<div class="contact-container">


<!-- contact cards -->

<div class="contact-info">


<div class="info-card">

<div class="icon">📞</div>

<h3>Phone</h3>

<p>+20 100 123 4567</p>

</div>


<div class="info-card">

<div class="icon">📧</div>

<h3>Email</h3>

<p>support@invopay.com</p>

</div>


<div class="info-card">

<div class="icon">📍</div>

<h3>Location</h3>

<p>Egypt</p>

</div>


</div>



<!-- form -->

<div class="contact-form">


<h2>Send Message</h2>


<div class="form-group">

<input type="text" placeholder="Your Name">

</div>


<div class="form-group">

<input type="email" placeholder="Your Email">

</div>


<div class="form-group">

<textarea placeholder="Write your message"></textarea>

</div>


<button class="send-btn">Send Message</button>


</div>



</div>


</div>

<script src="assets/js/main.js"></script>


</body>

</html>
